[project]
name = "youtube-ai-researcher"
version = "0.1.0"
description = "AI agent to research data based on economics and technology"
requires-python = ">=3.12"

dependencies = [
    "anthropic>=1.5.0",
    "asyncio>=4.0.0",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "llama-index-core>=0.14.24",
    "lxml>=6.1.3",
    "openai>=3.13.0",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "redis>=8.1.0",
    "typesafe-sdk>=0.7.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]
